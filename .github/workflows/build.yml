name: Build Otto Robot Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-otto-robot:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Force Clean Build Cache
        shell: bash
        run: |
          rm -rf build sdkconfig
          echo "Build cache cleared."

      - name: Build otto-robot and merge binary
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python scripts/build.py otto-robot --wake-word "ka ka" --language zh-CN

      - name: Rename merged binary
        shell: bash
        run: cp build/merged-binary.bin build/otto-robot-merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: otto-robot-merged-firmware
          path: build/otto-robot-merged.bin
          if-no-files-found: error
